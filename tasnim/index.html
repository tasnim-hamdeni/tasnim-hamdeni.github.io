<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://tasnim-classroom-service.beigepear256.chatgpt.site; object-src 'none'; base-uri 'self'; form-action 'self'"><title>Manage courses · Tasnim Hamdeni</title><link rel="icon" href="../assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../contrast.css"><script type="module" src="../admin.js"></script></head>
<body class="teacher-page"><a class="skip" href="#main">Skip to course management</a><header class="site-header wrap"><a class="brand" href="../"><span class="brand-mark" aria-hidden="true">th</span><span>Tasnim Hamdeni</span></a><a class="header-label" href="../" target="_blank" rel="noopener">Student website ↗</a></header>
<main class="admin-main wrap" id="main"><div class="section-heading admin-title"><h1>Manage courses</h1><div class="admin-session"><span id="connection-badge" class="badge">Signed out</span><button class="button secondary" id="disconnect" type="button" hidden>Sign out</button></div></div>
<section id="login-panel" class="panel connect-panel" aria-label="Teacher access"><form id="connect-form" autocomplete="off"><label for="access-code">Access code</label><div class="inline-form"><input id="access-code" type="password" inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12" autocomplete="off" required placeholder="Enter your code"><button class="button" id="connect-button">Sign in</button></div></form></section>
<div id="admin-status" class="status" role="status" aria-live="polite"></div><progress id="progress" aria-label="Publishing progress" hidden></progress>
<section id="workspace" hidden aria-label="Manage subjects, chapters and documents">
<div class="manager-layout"><aside class="panel subjects-panel" aria-labelledby="subjects-heading"><div class="section-heading"><h2 id="subjects-heading">Subjects</h2><button class="button secondary compact" id="admin-refresh" disabled aria-label="Refresh courses">↻</button></div><div id="admin-subjects" class="admin-items"></div><form id="subject-form" class="add-item-form"><fieldset disabled><label for="subject-name">New subject</label><input id="subject-name" required maxlength="80" placeholder="Subject name"><button class="button">+ Add subject</button></fieldset></form></aside>
<div class="course-manager"><section id="no-subject" class="empty-state" hidden>Add a subject to begin.</section><section id="subject-content" hidden><a class="back-to-subjects" href="#subjects-heading">← Subjects</a><section class="panel chapters-panel" aria-labelledby="selected-subject"><div class="section-heading"><div><p class="manager-label">Subject</p><h2 id="selected-subject"></h2></div></div><h3 class="manager-subheading">Chapters</h3><div id="admin-chapters" class="admin-items chapter-choices"></div><form id="chapter-form" class="add-item-form"><fieldset disabled><label for="chapter-name">New chapter</label><div class="inline-form"><input id="chapter-name" required maxlength="120" placeholder="Chapter name"><button class="button">+ Add chapter</button></div></fieldset></form></section>
<section id="chapter-content" class="panel documents-panel" aria-labelledby="selected-chapter" hidden><a class="back-to-chapters" href="#selected-subject">← Chapters</a><div class="section-heading"><div><p class="manager-label" id="document-count">Documents</p><h2 id="selected-chapter"></h2></div><button type="button" class="button" id="show-upload" aria-expanded="false" aria-controls="upload-form">+ Add document</button></div>
<form id="upload-form" class="upload-editor" hidden><fieldset disabled><label for="lesson-file">PDF or PowerPoint</label><input id="lesson-file" type="file" accept=".pdf,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation" required aria-describedby="upload-help"><p id="upload-help" class="field-help">PDF / PPTX · Maximum 50 MB · Public files only</p><label for="lesson-title">Document title</label><input id="lesson-title" required maxlength="160" placeholder="Title"><div class="upload-editor-actions"><button class="button">Upload document</button><button type="button" id="cancel-upload" class="button secondary">Cancel</button></div></fieldset></form>
<div id="admin-lessons" class="admin-items"></div></section></section></div></div></section>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">Delete?</h2><p id="confirm-message"></p><form method="dialog"><button value="cancel" class="button secondary">Cancel</button><button value="remove" class="button danger">Delete</button></form></dialog>
</main><footer class="wrap"><p>Tasnim Hamdeni</p></footer></body></html>
